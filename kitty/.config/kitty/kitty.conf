# ==========================
# ===  Font              ===
# ==========================
font_family      family="Berkeley Mono Regular"
italic_font      auto
bold_font        auto
bold_italic_font auto
font_size        11.0

# Nerd Fonts v3.2.0
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b1,U+e700-U+e7c5,U+ed00-U+efc1,U+f000-U+f2ff,U+f000-U+f2e0,U+f300-U+f372,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

# ==========================
# ===  Colors (Cursor Dark)
# ==========================
background_opacity              0.85

foreground                      #cccccc
background                      #181818
selection_foreground            none
selection_background            #264f78

cursor                          #aeafad
cursor_text_color               #181818

url_color                       #3b8eea

active_border_color             #2472c8
inactive_border_color           #2b2b2b
bell_border_color               #e5e510
visual_bell_color               none

wayland_titlebar_color          system
macos_titlebar_color            system

#: black
color0                          #000000
color8                          #666666
#: red
color1                          #cd3131
color9                          #f14c4c
#: green
color2                          #0dbc79
color10                         #23d18b
#: yellow
color3                          #e5e510
color11                         #f5f543
#: blue
color4                          #2472c8
color12                         #3b8eea
#: magenta
color5                          #bc3fbc
color13                         #d670d6
#: cyan
color6                          #11a8cd
color14                         #29b8db
#: white
color7                          #e5e5e5
color15                         #e5e5e5

# ==========================
# ===  Cursor            ===
# ==========================
shell_integration               no-cursor
cursor_shape                    block
cursor_blink_interval           0.5
cursor_stop_blinking_after      15.0

# ==========================
# ===  Scrollback        ===
# ==========================
scrollback_lines                20000
scrollback_pager                less +G -R
scrollback_pager_history_size   20
wheel_scroll_multiplier         2.0

# ==========================
# ===  Layouts / panes   ===
# ==========================
# First layout is the default. stack = tmux zoom.
enabled_layouts                 splits,stack

# Margin applies per window and doubles between splits; padding does not.
window_margin_width             0
window_padding_width            10
window_border_width             1pt
draw_minimal_borders            yes

# ==========================
# ===  Tab bar (status bar)
# ==========================
tab_bar_min_tabs                1
tab_bar_edge                    bottom
tab_bar_style                   powerline
tab_powerline_style             angled
tab_switch_strategy             previous
bell_on_tab                     "! "
tab_title_template              "{index}:{title}{' Z' if layout_name == 'stack' else ''}{fmt.fg.red}{bell_symbol}{activity_symbol}"

active_tab_background           #11a8cd
active_tab_foreground           #181818
inactive_tab_background         #2b2b2b
inactive_tab_foreground         #cccccc
tab_bar_background              #181818
tab_bar_margin_color            none

# ==========================
# ===  Clipboard         ===
# ==========================
copy_on_select                  clipboard
strip_trailing_spaces           smart
clipboard_control               write-clipboard write-primary read-clipboard-ask read-primary-ask

# ==========================
# ===  Remote control    ===
# ==========================
# kitty appends "-<pid>" to the socket path. Inside kitty windows, `kitten @`
# finds the socket through $KITTY_LISTEN_ON automatically.
allow_remote_control            socket-only
listen_on                       unix:/tmp/kitty

# ==========================
# ===  Misc              ===
# ==========================
enable_audio_bell               yes
term                            xterm-kitty
open_url_with                   default
#open_url_modifiers             ctrl+shift

# Negative: confirm only when a non-shell foreground process runs
# (needs shell integration). No detach exists, so closing kills everything.
confirm_os_window_close         -1

# Left option acts as alt on macOS; right option still composes characters.
macos_option_as_alt             left

# Optional: load a session on every start
#startup_session                ~/.local/share/kitty/sessions/default.kitty-session

# For ssh with terminfo + shell integration, put in shell rc:
#   alias ssh="kitten ssh"

# ==========================
# ===  Font size         ===
# ==========================
map ctrl+shift+up               increase_font_size
map ctrl+shift+down             decrease_font_size
map ctrl+shift+backspace        restore_font_size

# ==========================
# ===  Prefix: ctrl+a    ===
# ==========================
# Send a literal ctrl+a to the program
map ctrl+a>ctrl+a               send_text all \x01

# --- panes (kitty "windows") ---
# v/h are layout-independent aliases for the | and - splits
map ctrl+a>v                    launch --location=vsplit --cwd=current
map ctrl+a>h                    launch --location=hsplit --cwd=current
#map ctrl+a>|                    launch --location=vsplit --cwd=current
#map ctrl+a>minus                launch --location=hsplit --cwd=current
map ctrl+a>x                    close_window
map ctrl+a>z                    toggle_layout stack
map ctrl+a>space                next_layout
map ctrl+a>o                    next_window
map ctrl+a>q                    focus_visible_window
map ctrl+a>shift+q              swap_with_window
map ctrl+a>shift+left_bracket   move_window_backward
map ctrl+a>shift+right_bracket  move_window_forward
map ctrl+a>r                    start_resizing_window
map ctrl+a>ctrl+r               load_config_file

# --- tabs (tmux "windows") ---
map ctrl+a>c                    new_tab_with_cwd
map ctrl+a>n                    next_tab
map ctrl+a>shift+n              previous_tab
map ctrl+a>l                    goto_tab -1
map ctrl+a>w                    select_tab
map ctrl+a>comma                set_tab_title
map ctrl+a>shift+7              close_tab
map ctrl+a>1                    goto_tab 1
map ctrl+a>2                    goto_tab 2
map ctrl+a>3                    goto_tab 3
map ctrl+a>4                    goto_tab 4
map ctrl+a>5                    goto_tab 5
map ctrl+a>6                    goto_tab 6
map ctrl+a>7                    goto_tab 7
map ctrl+a>8                    goto_tab 8
map ctrl+a>9                    goto_tab 9

# --- scrollback / copy / hints ---
# page_up is a layout-independent alias for prefix [
map ctrl+a>page_up              show_scrollback
map ctrl+a>left_bracket         show_scrollback
# p = paste, as in your tmux.conf (bind p paste-buffer)
map ctrl+a>p                    paste_from_clipboard
map ctrl+a>f                    kitten hints --type path --program -
map ctrl+a>u                    kitten hints --type url

# --- sessions ---
# mkdir -p ~/.local/share/kitty/sessions
map ctrl+a>s                    goto_session ~/.local/share/kitty/sessions
map ctrl+a>slash                goto_session
map ctrl+a>backslash            goto_session -1
map ctrl+a>shift+s              save_as_session --use-foreground-process --relocatable --base-dir ~/.local/share/kitty/sessions
map ctrl+a>shift+x              close_session

# ==========================
# ===  No-prefix bindings ===
# ==========================
map alt+left                    neighboring_window left
map alt+right                   neighboring_window right
map alt+up                      neighboring_window up
map alt+down                    neighboring_window down

map alt+page_up                 scroll_page_up
map alt+page_down               scroll_page_down

map alt+1                       goto_tab 1
map alt+2                       goto_tab 2
map alt+3                       goto_tab 3
map alt+4                       goto_tab 4
map alt+5                       goto_tab 5
map alt+6                       goto_tab 6
map alt+7                       goto_tab 7
map alt+8                       goto_tab 8
map alt+9                       goto_tab 9
